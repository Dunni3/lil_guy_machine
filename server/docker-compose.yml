# The lil guy machine server on its own Lightsail box (Small, 2 GB): Postgres, the ingest service,
# the sim host, and Caddy in front for TLS.
# Secrets live in server/.env and server/.env.host on the box (see the .example files) and never leave it.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lilguy
      POSTGRES_DB: lilguy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Localhost only, for querying from the Mac over an SSH tunnel (make server-tunnel).
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilguy -d lilguy"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Small box: keep Postgres modest.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lilguy:${POSTGRES_PASSWORD}@db:5432/lilguy
      LILGUY_INGEST_TOKENS: ${LILGUY_INGEST_TOKENS:?set LILGUY_INGEST_TOKENS in server/.env}
    depends_on:
      db:
        condition: service_healthy

  # Built from server/host/dist/, which deploy.sh stages first. No published port: only Caddy reaches it.
  host:
    build: ./host
    restart: unless-stopped
    env_file:
      - path: .env.host
        required: false
    environment:
      LILGUY_HOST_BIND: 0.0.0.0
      LILGUY_DB: /data/lilguy.db
      LILGUY_SYNC_URL: http://api:8787
      JAVA_OPTS: -Xmx512m
    mem_limit: 800m
    volumes:
      - host-data:/data
    # Time for the last rows to sync on the way down.
    stop_grace_period: 30s
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in server/.env}
      HOST_DOMAIN: ${HOST_DOMAIN:?set HOST_DOMAIN in server/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in server/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - host

volumes:
  db-data:
  host-data:
  caddy-data:
  caddy-config:
