# The bedroom's content: the room, need rules, items and activities. Every job, purchase and
# hobby is a row here; the engine (BedroomWorld) only knows the fields. Times are game minutes,
# rates are per game hour, money is whole dollars. Numbers started as the plan's first guesses
# (research_notes/2026-10-29_0313_bedroom-proposal-and-roadmap-v2.html); changes are noted inline
# and in docs/DECISIONS.md.
#
# Tiers: anything with `tier` above 0 is gated. It stays in the file, tuned, but isn't in his
# world (options, shop, prompt) until its id is granted. Nothing is gated right now: the old
# tier-1 content (easel, canvas, painting, records, books, decor) is in the shop from day one so
# he can see it, save for it and ask for it in his journal
# (research_notes/2026-10-29_2300_catalog-and-cheap-easel-plan.md).

room:
  # One string per row. '#' wall, '.' floor, '@' where he starts; other letters are slots
  # (below). A slot is empty until he owns the item that goes there.
  rows:
    - "#####oF#####"
    - "#b.......s.#"
    - "#.........p#"
    - "#....r.....#"
    - "#..........H"
    - "#e.........#"
    - "#.@....cd..#"
    - "############"
  # H was a door (D), which kept suggesting he could leave; it's a mail hatch in the wall now.
  slots: { b: bed, d: desk, c: chair, e: easel, s: shelf, p: plant, o: poster, r: rug, H: hatch, F: rail }
  # Slots in the wall rather than on the floor.
  wall_slots: [poster, hatch, rail]

start:
  # Was 40: one day of slack at most.
  money: 20
  time: "08:00"
  needs: { energy: 80, fullness: 70, mood: 60, stimulation: 60 }
  items: { mail_hatch: 1, picture_rail: 1, bed: 1, desk: 1, chair: 1, sketchbook: 1, journal: 1, meal: 2 }

needs:
  awake_energy_per_hour: -4
  fullness_per_hour: -5
  # Mood moves this much an hour toward the baseline plus the room's comfort.
  mood_drift_per_hour: 3
  mood_baseline: 50
  # Below `low` energy or fullness, mood falls `low_mood_per_hour` instead of drifting.
  low: 15
  low_mood_per_hour: -5
  # Activities marked `work` are refused below these.
  work_floor:
    - { need: energy, below: 5, reason: "too tired to work" }
    - { need: fullness, below: 5, reason: "too hungry to work" }
  # He needs to express himself: a day without finishing a journal entry (counted from the start of
  # the run) and his mood falls instead of drifting, until he writes. Low mood stops him making
  # art (sketch and paint block below 25), so it ends up costing him his income too.
  neglect:
    - { activity: journal, after_hours: 24, mood_per_hour: -5, reason: "a day without writing in your journal" }
  # Stimulation (low = bored) drains while he's awake. Hobbies, making things and anything new feed
  # it; repeating the same thing pays less and drains it (habituation, below). Mood is the summary:
  # below `bored`, each missing point lowers the mood he settles to by `bored_mood` (16 at 0).
  # (research_notes/2026-10-30_1951_world-grammar-consolidated-plan.md, step 1)
  stimulation_per_hour: -3
  bored: 40
  bored_mood: 0.4

# Repetition wears an activity thin: each time he finishes one, its wear rises `per_repeat` (wear
# runs 0 to 1) and fades `recover_per_hour`. Its mood and stimulation gains are paid at 1 - wear, and
# finishing one that was already worn costs `stale_stimulation` times the wear. Activities marked
# `routine` (eating, sleeping, selling, hanging) don't wear. A use wears per item, so each record is
# its own.
habituation:
  per_repeat: 0.25
  recover_per_hour: 0.04
  stale_stimulation: -6

# The first time he finishes an activity (or plays a given record) pays this on top. Routine ones don't count.
novelty:
  effects: { stimulation: 15, mood: 4 }

shop:
  # Orders are placed and delivered at the mail hatch.
  at: mail_hatch
  minutes: 10

think:
  # The think intent: he stops where he is and works out what he wants; a text model writes the
  # thought. Thinking is a little tiring, on top of the awake loss.
  minutes: 10
  energy: -2
  # He is made to think after this many decisions without a think (the decision model isn't
  # asked); remove it to leave thinking to the model. His latest thought is in every prompt.
  every: 4

# Art is drawn: when an activity that makes art finishes, a text model draws the piece (agent/.../art/).
# A request for a piece comes through the hatch each day at `arrive`, replacing the day before's:
# an adjective and a noun from these lists. A piece he finishes while it's open is drawn for it, and
# the first one sold whose drawing matches (its title or tags name both words) earns `reward` on top
# of its price (research_notes/2026-10-29_2148_art-making-plan.md).
commissions:
  arrive: "09:00"
  reward: 12
  adjectives: [sleepy, stormy, tiny, golden, lonely, cheerful, ancient, frozen, glowing, secret, upside-down, rainy, busy, quiet, wild, striped]
  nouns: [lighthouse, cat, mountain, teapot, garden, whale, rocket, fox, castle, bicycle, moon, sailboat, owl, cactus, bridge, forest]

# Hung art: hang_art puts his newest unsold piece on the picture rail, where it raises the room's
# comfort (and so the mood he settles to) instead of being sold. At most `max` at once.
gallery:
  max: 3
  comfort_each: 3

# The closed lists items are described in (research_notes/2026-10-30_1951_world-grammar-consolidated-plan.md,
# step 2); a word that isn't here is a content error.
vocabulary:
  # What can be done with an item. Activities ask for these (a book is `readable`), so a new item
  # with an affordance works with every activity that asks for it.
  affords: [readable, playable, edible, sellable, hangable, viewable, combinable, wearable]
  # What an item is like to him, each with a strength from 0 to 3, scored by his affinities.
  qualities: [cozy, calm, warm, soft, bright, pretty, natural, lively, strange, loud]

# Who he is, as numbers; a run can swap in another. Affinities run from -1 (it puts him off) to 2,
# and a quality left out counts 0. Curiosity scales how fast stimulation drains and how much a first
# time pays. These defaults keep the decor's comfort where it was (plant 4, poster 3, rug 6).
personality:
  affinities: { cozy: 1, calm: 1, warm: 1, soft: 1, bright: 1, pretty: 1, natural: 1, lively: 0.5, strange: 0.5, loud: -0.5 }
  curiosity: 1

# An item's value to him is each quality's strength times his affinity for it, summed. Mostly it's
# paid when he does something with it: a consumptive use (a record on the player) adds `in_use`
# mood per point when it finishes. A little is passive: an item in its slot adds `in_view` comfort
# per point, which raises the mood he settles to.
quality_value:
  in_view: 1
  in_use: 1

# kind is for display and grouping: fixture, furniture, decor, tool, food, supply, record, book, art.
# A `slot` item is placed in that slot when owned; `blocks` means he stands beside it, not on it.
# `stackable` items are counted; the rest are one of a kind. `affords` and `qualities` use the
# vocabulary above; an activity can ask for an item by id or by affordance.
items:
  - { id: mail_hatch, name: mail hatch, kind: fixture, slot: hatch, blocks: true }
  - { id: picture_rail, name: picture rail, kind: fixture, slot: rail, blocks: true }
  - { id: bed, name: bed, kind: furniture, slot: bed }
  - { id: desk, name: desk, kind: furniture, slot: desk, blocks: true }
  - { id: chair, name: chair, kind: furniture, slot: chair }
  - { id: sketchbook, name: sketchbook, kind: tool }
  - { id: journal, name: journal, kind: tool }
  # Was 18 a pack: food is now about $21 a day.
  - { id: meal, name: meal, kind: food, affords: [edible], price: 24, pack: 3, stackable: true }
  - { id: canvas, name: canvas, kind: supply, price: 15, stackable: true }
  # Was 120: at $3 a sketch he could not save that. $17 is a few hours of sketching, to see how the climb to painting plays out.
  - { id: easel, name: easel, kind: furniture, slot: easel, blocks: true, price: 17 }
  - { id: record_player, name: record player, kind: furniture, slot: shelf, blocks: true, price: 150 }
  - { id: jazz_record, name: jazz record, kind: record, affords: [playable], qualities: { lively: 2, warm: 1 }, price: 20 }
  - { id: ambient_record, name: ambient record, kind: record, affords: [playable], qualities: { calm: 2, strange: 1 }, price: 20 }
  - { id: folk_record, name: folk record, kind: record, affords: [playable], qualities: { warm: 2, natural: 1 }, price: 20 }
  # Books carry qualities for when he reads a particular one (the library, step 3); `read` doesn't know which yet.
  - { id: novel, name: novel, kind: book, affords: [readable], qualities: { strange: 2, warm: 1 }, price: 12 }
  - { id: poetry_book, name: poetry book, kind: book, affords: [readable], qualities: { pretty: 2, calm: 1 }, price: 12 }
  - { id: field_guide, name: field guide, kind: book, affords: [readable], qualities: { natural: 2, bright: 1 }, price: 12 }
  # Decor: in view, its qualities raise comfort. Was a fixed `comfort` (4, 3, 6), which the default personality keeps.
  - { id: plant, name: plant, kind: decor, slot: plant, blocks: true, price: 25, affords: [viewable], qualities: { natural: 2, calm: 2 } }
  - { id: poster, name: poster, kind: decor, slot: poster, blocks: true, price: 15, affords: [viewable], qualities: { bright: 2, pretty: 1 } }
  - { id: rug, name: rug, kind: decor, slot: rug, price: 60, affords: [viewable], qualities: { cozy: 3, soft: 2, warm: 1 } }
  # Art is carried until sold or hung. Sketches were $12: now food takes most of his working hours.
  # `canvas` is what the drawing model gets: a square grid `size` wide, up to `colors` colors and
  # `ops` drawing operations. Painting's bigger canvas is what the easel buys him. Hung art's comfort
  # is the gallery's, since what a piece is like is whatever he drew.
  - { id: sketch, name: sketch, kind: art, affords: [sellable, hangable, viewable], carried: true, stackable: true, sell_price: 3, canvas: { size: 16, colors: 4, ops: 40 } }
  - { id: painting, name: painting, kind: art, affords: [sellable, hangable, viewable], carried: true, stackable: true, sell_price: 70, canvas: { size: 32, colors: 16, ops: 120 } }

# do(activity). `kind`: what sort of verb it is (consumptive, generative, transformative,
# expressive, economic, rest; perceptual and study come later), and each kind is a contract on the
# fields below (sim/.../VerbKind.kt). `at`: where it happens (an owned slot item; the nearest is
# used). `requires`: items or affordances he must own. `consumes`: items or affordances used up
# when it finishes. `effects`: need changes when it finishes. `rates`: need changes per hour while
# doing it. `block`: refused when a need is above or below a level. Activities end after `minutes`,
# or for `until`, at a time of day or when a need reaches a level, whichever comes first;
# `stop_below` ends one early when a need drops. `phrase` is how the prompt says what he can do.
# `routine`: upkeep that neither wears thin nor counts as new (see habituation); economic and rest
# verbs always are. Listed in the order options are offered to models.
activities:
  - id: eat
    kind: consumptive
    at: [desk]
    minutes: 30
    routine: true
    consumes: { edible: 1 }
    effects: { fullness: 45 }
    block: [{ need: fullness, above: 90, reason: "not hungry" }]
  - id: sketch
    kind: generative
    at: [desk]
    requires: [sketchbook]
    minutes: 60
    work: true
    produces: { sketch: 1 }
    # Work wears his mood down; journaling is what lifts it (Ian). A little stimulation, which
    # habituation soon wears away: sketching all day bores him.
    effects: { energy: -6, mood: -4, stimulation: 3 }
    block: [{ need: mood, below: 25, reason: "too low to make art" }]
  - id: paint
    kind: generative
    at: [easel]
    minutes: 180
    work: true
    consumes: { canvas: 1 }
    produces: { painting: 1 }
    effects: { energy: -15, mood: -10, stimulation: 12 }
    block: [{ need: mood, below: 25, reason: "too low to make art" }]
  - id: sell_art
    kind: economic
    phrase: sell your art
    at: [mail_hatch]
    # Was 60: a sale is a hand-off at the hatch, not an hour of his day (Ian).
    minutes: 1
    sells: sellable
  - id: hang_art
    kind: transformative
    phrase: hang your art on the wall
    at: [picture_rail]
    minutes: 15
    routine: true
    hangs: hangable
  # The agent layer writes an entry when one succeeds (agent/.../memory/JournalWriter.kt). It is
  # work, so it needs him fed and rested, and costs more energy than sketching: writing about the
  # life he wants is budgeted against staying alive.
  - id: journal
    kind: expressive
    phrase: write in your journal
    at: [desk]
    requires: [journal]
    minutes: 60
    work: true
    # Was mood +3: expressing himself is what makes him happier.
    effects: { energy: -10, mood: 12, stimulation: 6 }
  # Hobbies were mood +6 and +10. Mood is now mostly the summary of the other needs, so most of
  # what they gave moved to stimulation.
  - id: read
    kind: consumptive
    at: [bed, chair]
    requires: [readable]
    minutes: 60
    effects: { mood: 2, stimulation: 15 }
  - id: listen
    kind: consumptive
    at: [chair]
    requires: [record_player, playable]
    minutes: 30
    effects: { mood: 4, stimulation: 12 }
  - id: sleep
    kind: rest
    at: [bed]
    until: { time: "07:00", need: energy, reaches: 100 }
    asleep: true
    rates: { energy: 12 }
    # Added in tuning: he wakes up hungry rather than sleeping fullness down to 0.
    stop_below: { fullness: 10 }
    block: [{ need: energy, above: 94, reason: "not tired" }]

# use(itemId, on): an item on another. Same fields as activities, plus the item (an id or an
# affordance), the target, and `background`: an effect that keeps going while he does anything else.
uses:
  - id: play_record
    kind: consumptive
    item: playable
    on: record_player
    at: [record_player]
    minutes: 1
    # Was mood +4/h.
    background: { name: music, minutes: 45, rates: { mood: 2, stimulation: 6 } }
