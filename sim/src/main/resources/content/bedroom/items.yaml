  # compost bin turns the scraps left from his meals into compost; the raised bed beside it, within
  # reach, takes the compost itself and grows cherry tomatoes from each by daylight. He carries the
  # scraps over and the tomatoes in. (The planter indoors grows by watering instead: rules.yaml `growing`.)
  - { id: compost_bin, name: compost bin, group: gadget, slot: compost_corner, blocks: true, price: 25, machine: { runs: [compost], holds: 6, wear: 15 } }
