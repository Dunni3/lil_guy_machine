  - { id: compost_brick, name: compost brick, group: scrap, stackable: true }
  # What mending a machine uses up.
  - { id: spare_parts, name: spare part, group: supply, price: 8, pack: 2, stackable: true }
  # The machine that pays (docs/decisions/2026-11-15-art-gets-him-by-machines-get-him-ahead.md): the kiln
