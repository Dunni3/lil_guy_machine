# yaml-language-server: $schema=schema/menu.schema.json
# How his options are put to a picking model (Jev): not as one flat list but as a tree it walks
# down from the top by beam search (decision/.../BeamSearch.kt). Each node is a kind of thing he
# could do, and `says` is what's under it, which is all the model sees of a node until it opens it.
#
# `under`: the node it sits in (an earlier one); the top when left out. `verbs`: the activities in
# it, each in at most one node. A purchase sits in the node of the first verb the item is for (a
# record with play_record), else in the node whose `buys` names its item group (decor). Waiting,
# and anything placed nowhere, stays at the top. A node with nothing on offer is left out, and one
# with a single option is that option. Going to a place sits in the node with `go: true`, and
# putting a thing somewhere else in the node with `put: true`, under a node for each thing.
menu:
  - id: upkeep
    says: look after his body - eat something or sleep
    verbs: [eat, eat_oats, sleep]
    buys: [food]
  - id: art
    says: make art to sell or keep - sketch or paint - then sell it or hang it on his wall, or buy what art needs
    verbs: [sketch, paint, sell_art, hang_art]
  - id: leisure
    says: do something for the pleasure of it rather than money - music or books
  - id: music
    under: leisure
    says: music - put a record on, listen to what's playing, play the guitar, or buy records or something to play them on
    verbs: [play_record, listen, play_guitar]
    buys: [record, instrument]
  - id: books
    under: leisure
    says: books - read a chapter of one he owns, or buy a new book
    verbs: [read]
    buys: [book]
  - id: room
    says: make his home nicer - buy decor or furniture to look at, water or pick from a planter, or build a new room onto the house or move one
    verbs: [build_room, water_plant, harvest]
    buys: [decor, furniture, room]
  - id: lamps
    under: room
    says: switch one of his lamps on or off, or put it back on its timer
    verbs: [switch_on, switch_off, lamp_timer]
  - id: arrange
    under: room
    says: move one of his things to another spot - elsewhere in the house, or outdoors by the front door, in the garden, by the pond or in the forest
    put: true
  - id: workshop
    says: his machines, or invent something new of his own design at the workbench and build it from his materials - a thing for his room, a record, a book, food or something to sell - take apart one he made or sell spare materials back, or write code for a new thing to do, or for what one of his things does
    verbs: [invent, dismantle, sell_materials, devise]
  - id: machines
    under: workshop
    says: look after his machines - fill one and take out what it made, sell what they made, mend one that's worn or jammed, or connect them so they feed each other, feed from his things and sell by themselves
    verbs: [tend, sell_wares, repair, connect, sell_by_itself, feed_by_itself, disconnect]
  - id: shopping
    says: go through the shop's catalog and buy food, supplies or things to own - furniture, decor, books, records - or see what to save for
    verbs: [shop]
  - id: outdoors
    says: the outdoors - go out to the garden, the forest or the pond, explore them, collect samples, watch the birds, moths or fireflies that come, study or sell the samples, or read a weather station's log
    verbs: [explore, collect, watch, check_station, study_sample, sell_sample]
    go: true
  - id: mail
    says: letters - open one someone outside his world sent him through the mail hatch, or write to someone who has written to him
    verbs: [read_mail, write_letter]
  - id: mind
    says: stop to think things over and plan, asking how things in his world work
    verbs: [think]
