# yaml-language-server: $schema=schema/verbs.schema.json
# What he can do: do(verb, what, on). Listed in the order options are offered to models.
#
# `kind`: what sort of verb it is, a contract on which ops `effects` may use (sim/.../VerbKind.kt).
# `args`: its argument slots (`what`, `on`), each filled by an item he owns that answers to the
# id or affordance given; do() names the items or the first owned match is used, and options are
# listed once per way to fill them. `at`: where it happens: owned slot items (the nearest is
# used), an argument naming one (`on`), or `here`. `requires`: items or affordances he must own. `block`: refused when a need is above or below a level. It ends after
# `minutes`, or for `until`, at a time of day or when a need reaches a level, whichever comes
# first; `stop_below` ends it early when a need drops. `work`: refused below the work floor.
# `phrase`: how the prompt says what he can do. `routine`: upkeep that neither wears thin nor
# counts as new; economic and rest verbs always are.
#
# `effects`: what it does, a list of ops run in order (sim/.../Ops.kt): `need` (changes when it
# finishes), `rate` (per hour while doing it), `consume` and `produce` (items, by id or
# affordance), `sell` (everything carried with an affordance), `set_state` (hung: onto the
# picture rail), `background` (keeps going while he does anything else), `sleep`, and `enjoy`
# (an argument's value to him, as mood), `progress` (the next chapter of the book bound to an
# argument; `study: true` also raises the book's skills, library.yaml) and `practice` (raises
# skills; the verb's mood and stimulation gains grow with them). Where an op names an item it can
# name an argument instead.
#
# Two ops are authored: a model writes their result, and a handler in the agent layer runs it
# (agent/.../authored/). `write: { with, into, timing, shows_as }` (with: thought; into: events,
# short_term; timing: before the verb starts, or during it) and `draw: item` (the
# drawing model draws a piece the verb produced). Results are kept only if the verb succeeds. A
# verb whose `write` has no handler configured isn't offered to models, unless the write is
# `optional`; the sim still runs it. `with: reading` writes what stuck with him from a chapter.
# `wear: verb`: repetition wears the verb as a whole, whatever it's done with (any book wears
# "read"); by default each item wears on its own (each record). What counts as new stays per item.
# `no_repeat`: locked right after he did it. `by_day: { block, minutes }`: started outside the night
# (rules.yaml `night`), these blocks apply too and it lasts at most `minutes`.

verbs:
  - id: eat
    kind: consumptive
    at: [desk]
    minutes: 30
    routine: true
    block: [{ need: fullness, above: 90, reason: "not hungry" }]
    effects:
      - consume: { edible: 1 }
      - need: { fullness: 45 }
  # The floor under hunger: the oats in the cupboard never run out and cost nothing, so he can't be
  # left starving with no way to eat, and so no way to sleep (hunger wakes him) or work. Offered at
  # rules.yaml's `low` fullness, where hunger starts pulling his mood down, so oats can always lift
  # him out of that. Meals stay worth buying: oats fill less, and they aren't routine, so a diet of
  # them wears thin and bores him (habituation), which lowers the mood he settles to.
  - id: eat_oats
    kind: consumptive
    phrase: eat plain oats from the cupboard
    at: [desk]
    requires: [staple]
    minutes: 15
    block: [{ need: fullness, above: 15, reason: "not hungry enough for plain oats" }]
    effects:
      - need: { fullness: 25 }
  - id: sketch
    kind: generative
    at: [desk]
    requires: [sketchbook]
    minutes: 60
    work: true
    block: [{ need: mood, below: 25, reason: "too low to make art" }]
    effects:
      - produce: { sketch: 1 }
      - draw: sketch
      - practice: { art: 0.1 }
      # Work costs him a little mood. A little stimulation, which habituation soon wears away:
      # sketching all day bores him.
      - need: { energy: -3, mood: -1, stimulation: 4 }
  - id: paint
    kind: generative
    at: [easel]
    minutes: 180
    work: true
    block: [{ need: mood, below: 25, reason: "too low to make art" }]
    effects:
      - produce: { painting: 1 }
      - draw: painting
      - consume: { canvas: 1 }
      - practice: { art: 0.25 }
      - need: { energy: -8, mood: -3, stimulation: 12 }
  - id: sell_art
    kind: economic
    phrase: sell your art
    at: [mail_hatch]
    minutes: 1
    effects:
      - sell: sellable
  # A shopping trip, the one way he buys anything while there's a shopper: he looks through the
  # whole catalog, food included, what he can afford and what he can't, and picks what to buy and
  # what he's saving for, with his reasons; that's written before he goes (agent/.../shop/Shopper.kt)
  # and the basket buys it as he finishes, each item checked like a buy.
  - id: shop
    kind: economic
    phrase: go through the shop's catalog
    at: [mail_hatch]
    minutes: 20
    routine: true
    no_repeat: true
    effects:
      - write: { with: shopping, into: [events], timing: before }
      - basket: { most: 3 }
  - id: hang_art
    kind: transformative
    phrase: hang your art on the wall
    args: { what: hangable }
    at: [picture_rail]
    minutes: 15
    routine: true
    effects:
      - set_state: { target: what, state: hung }
  # A chapter a session. Reading is for the story; studying (below) is for the skill. Both wear as
  # a whole, so a pile of books isn't a pile of fresh hobbies.
  - id: read
    kind: consumptive
    phrase: read a chapter
    args: { what: readable }
    at: [bed, chair]
    minutes: 60
    wear: verb
    effects:
      - progress: { book: what }
      - need: { mood: 2, stimulation: 6 }
      - enjoy: what
      - write: { with: reading, into: [events], timing: during, optional: true }
  - id: study
    kind: study
    phrase: study a chapter
    args: { what: readable }
    at: [desk]
    minutes: 90
    wear: verb
    block: [{ need: mood, below: 20, reason: "too low to concentrate" }]
    effects:
      - progress: { book: what, study: true }
      - need: { energy: -4, stimulation: 8 }
      - write: { with: reading, into: [events], timing: during, optional: true }
  # Taught by music_book.
  - id: play_guitar
    kind: study
    phrase: play the guitar
    at: [chair]
    requires: [guitar]
    minutes: 45
    effects:
      - practice: { music: 0.3 }
      - need: { energy: -2, mood: 5, stimulation: 10 }
  # Putting a record on is how music starts; listen sits down with whatever is on, so it takes no record
  # of its own and is offered only while there's music with time for it left.
  - id: listen
    kind: consumptive
    at: [chair]
    minutes: 30
    effects:
      - hear: music
      - need: { mood: 4, stimulation: 12 }
  # Gone to bed at night, he sleeps until 07:00 or full energy. At any other hour it's a nap: only
  # when he's exhausted, and short.
  - id: sleep
    kind: rest
    at: [bed]
    until: { time: "07:00", need: energy, reaches: 100 }
    by_day:
      block: [{ need: energy, above: 25, reason: "not bedtime yet; by day only a nap, when exhausted" }]
      minutes: 90
    # He wakes up hungry rather than sleeping fullness down to 0.
    stop_below: { fullness: 10 }
    block: [{ need: energy, above: 94, reason: "not tired" }]
    effects:
      - sleep: {}
      - rate: { energy: 12, frustration: -6 }
  - id: play_record
    kind: consumptive
    phrase: put a record on
    args: { what: playable, on: record_player }
    at: [on]
    minutes: 1
    effects:
      - enjoy: what
      - background: { name: music, minutes: 45, rates: { mood: 2, stimulation: 6 } }
  # He stops where he is and works out what he wants; the thought is written before he starts, and
  # his latest one shows in every later prompt as his plan. While he thinks he may ask how something
  # in his world works, and an oracle that has read the world's docs answers (agent/.../Thinker.kt);
  # his latest answers show in later prompts. It's how he discovers the world as he goes.
  - id: think
    kind: expressive
    phrase: stop and think
    at: [here]
    minutes: 10
    routine: true
    no_repeat: true
    effects:
      - need: { energy: -1 }
      - write: { with: thought, into: [events, short_term], timing: before, shows_as: plan }
