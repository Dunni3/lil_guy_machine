# Copy to config/endpoints.yaml (gitignored) and edit. Keys come from the environment,
# never from this file. Not read by anything until milestone 3.
endpoints:
  hosted:
    kind: openai_compat
    base_url: https://api.provider.example/v1
    api_key_env: PROVIDER_API_KEY
    model: provider-model-name
  local:
    kind: openai_compat
    base_url: http://inference-box.local:8000/v1
    model: qwen-or-llama-instruct
    structured_output: json_schema

agents:
  - character: hero
    endpoint: hosted        # swap to "local" with no code change
    decision_interval: on_intent_complete
