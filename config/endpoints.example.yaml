# Copy to config/endpoints.yaml (gitignored) and edit. Keys come from the environment
# variable named by api_key_env, never from this file. Read by the CLI (--endpoint NAME), the
# desktop app (make desktop ENDPOINT=NAME) and the TV (make tv-push-config).
#
# Per-endpoint options (defaults in brackets):
#   structured_output  json_schema | tools | text   [json_schema]
#   strict             ask the server to enforce the schema exactly   [true]
#   temperature        overrides the request's 0.7
#   send_temperature   false for models that reject a temperature   [true]
#   max_tokens, reasoning_effort   passed through when set
#   timeout_s          per HTTP call   [30]
#   max_retries        invalid replies sent back with the error   [2]
#   tool_choice        for structured_output: tools   [required]; the bedroom's own tools are always auto (calling is optional); anthropic: auto, or any (current Opus and Sonnet reject any)
#   beam               typesafe: paths kept when walking a grouped choice set; 0 for one flat list   [3]
#   price_in, price_out   dollars per million input / output tokens; the CLI's token report then shows cost
#   price_cached       dollars per million input tokens read from the server's prompt cache   [price_in]
endpoints:
  # TypeSafe System One (docs.typesafe.ai): Jev picks from a closed set of options rather
  # than writing JSON, so only kind, base_url, model, api_key_env and timeout_s apply.
  typesafe:
    kind: typesafe
    base_url: https://api.typesafe.ai
    api_key_env: TYPESAFE_API_KEY
    model: jev-latest
    price_in: 0.042
    price_out: 0
  # Google's OpenAI-compatible endpoint. Gemini 3.5 models think before they answer unless told not to, and
  # bill the thinking as output, so reasoning_effort: low is most of the saving on gemini. Prices are
  # Google's list prices (Nov 2026).
  gemini:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model: gemini-3.5-flash
    timeout_s: 60
    reasoning_effort: low
    price_in: 1.5
    price_out: 9
  # The live life's writer: memories, thoughts, the self-model, shopping, commissions. About a tenth of
  # gemini's cost a call, with thoughts and memories as good in side-by-side replays.
  gemini-lite:
    kind: openai_compat
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    model: gemini-3.5-flash-lite
    timeout_s: 60
    reasoning_effort: low  # it seldom thinks, but once spent 20k tokens on a one-line thought
    max_tokens: 4096       # counts the thinking too, so it caps a runaway at about a cent
    price_in: 0.3
    price_out: 2.5
  # DeepSeek V4.1 Flash, open weights, on DeepSeek's own API (hosted in China). It thinks unless told not to
  # (reasoning_effort low, high or max), and reads repeated prompt prefixes from its cache at about 2% of the
  # input price, which price_cached counts. It doesn't document strict tool schemas, so strict is off. Prices
  # are the weekday peak ones (01-04 and 06-10 UTC); the rest of the week costs half (Nov 2026).
  deepseek:
    kind: openai_compat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-flash
    strict: false
    reasoning_effort: low
    timeout_s: 60
    price_in: 0.3
    price_cached: 0.006
    price_out: 1.2
  # The same model on DeepInfra (US-hosted, no peak hours). DeepInfra's list prices (Nov 2026).
  deepseek-deepinfra:
    kind: openai_compat
    base_url: https://api.deepinfra.com/v1/openai
    api_key_env: DEEPINFRA_API_KEY
    model: deepseek-ai/DeepSeek-V4.1-Flash
    strict: false
    reasoning_effort: low
    timeout_s: 60
    price_in: 0.14
    price_cached: 0.0042
    price_out: 0.42
  # Anthropic's Messages API, natively (kind: anthropic). No temperature is sent; reasoning_effort
  # becomes output_config.effort; thinking is the model's adaptive default and counts toward
  # max_tokens. Drop-ins for the gemini writers, by price: claude-haiku under gemini-lite, claude-sonnet
  # near gemini, claude (Opus) above both. Anthropic's list prices (Nov 2026); the prompt is cached,
  # and cache writes (1.25x price_in) aren't counted in the report.
  claude-haiku:
    kind: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    model: claude-haiku-5-5
    timeout_s: 60
    reasoning_effort: low
    max_tokens: 8192
    price_in: 0.1
    price_cached: 0.01
    price_out: 0.5
  claude-sonnet:
    kind: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    model: claude-sonnet-5-5
    timeout_s: 60
    reasoning_effort: low
    max_tokens: 8192
    price_in: 2
    price_cached: 0.1
    price_out: 10
  claude:
    kind: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    model: claude-opus-5-5
    timeout_s: 90
    reasoning_effort: low
    max_tokens: 8192
    price_in: 4
    price_cached: 0.2
    price_out: 20
  hosted:
    kind: openai_compat
    base_url: https://api.provider.example/v1
    api_key_env: PROVIDER_API_KEY
    model: provider-model-name
  local:
    kind: openai_compat
    base_url: http://inference-box.local:8000/v1
    model: qwen-or-llama-instruct
    structured_output: json_schema

agents:
  - character: hero
    endpoint: typesafe        # swap to "local" with no code change
    memory_endpoint: gemini-lite # writes long-term memories; must write text (not typesafe). Optional.
    writer_endpoint: gemini-lite # writes his thoughts (think), his self-model each night and the day's
                              # commission; must write text. Defaults to memory_endpoint; "none" and
                              # he isn't offered think. (journal_endpoint is the old name, still read.)
    recall_endpoint: typesafe # scores which memories and thoughts reach each prompt, and each event's
                              # significance; typesafe only. Optional: without it recall uses keywords.
    painter_endpoint: typesafe # draws his art, two closed picks a stroke; set it when a text model decides
                              # (gemini calls his verbs as tools). Optional: the deciding endpoint draws.
    decision_interval: on_intent_complete

# Web search: a model that calls tools (gemini deciding) gets a `search` look, real results from
# the real web, read-only. Leave this out, or set kind: none, and he can't search. The viewer's
# menu lists every search under WEB.
search:
  kind: gemini                 # gemini: a Gemini model grounded on Google Search says what the
                               # results say, and names the pages. brave: the Brave Search API's
                               # results as they are (api_key_env: BRAVE_SEARCH_API_KEY).
  model: gemini-3.5-flash-lite
  api_key_env: GEMINI_API_KEY
  per_day: 20                  # searches a game day; past it he's told he's searched enough
  results: 5                   # sources kept a search
  thinking_level: low
  price_in: 0.3
  price_out: 2.5
  price_per_search: 0.014      # grounding bills by the query, on top of the tokens
