# Copy to config/endpoints.yaml (gitignored) and edit. Keys come from the environment
# variable named by api_key_env, never from this file. Read by the CLI (--endpoint NAME), the
# desktop app (make desktop ENDPOINT=NAME) and the TV (make tv-push-config).
#
# Per-endpoint options (defaults in brackets):
#   structured_output  json_schema | tools | text   [json_schema]
#   strict             ask the server to enforce the schema exactly   [true]
#   temperature        overrides the request's 0.7
#   send_temperature   false for models that reject a temperature   [true]
#   max_tokens, reasoning_effort   passed through when set
#   timeout_s          per HTTP call   [30]
#   max_retries        invalid replies sent back with the error   [2]
#   tool_choice        for structured_output: tools   [required]
endpoints:
  # TypeSafe System One (docs.typesafe.ai): Jev picks from a closed set of options rather
  # than writing JSON, so only kind, base_url, model, api_key_env and timeout_s apply.
  typesafe:
    kind: typesafe
    base_url: https://api.typesafe.ai
    api_key_env: TYPESAFE_API_KEY
    model: jev-latest
  hosted:
    kind: openai_compat
    base_url: https://api.provider.example/v1
    api_key_env: PROVIDER_API_KEY
    model: provider-model-name
  local:
    kind: openai_compat
    base_url: http://inference-box.local:8000/v1
    model: qwen-or-llama-instruct
    structured_output: json_schema

agents:
  - character: hero
    endpoint: typesafe        # swap to "local" with no code change
    memory_endpoint: hosted   # writes long-term memories; must write text (not typesafe). Optional.
    journal_endpoint: hosted  # writes his journal entries and his thoughts (think); must write text.
                              # Defaults to memory_endpoint; "none" and he is offered neither.
    decision_interval: on_intent_complete
