# Kotlin / AGP / Gradle match smarter-tv's tv-app, which is known to build and run on the Streamer.
[versions]
kotlin = "2.0.20"
agp = "8.5.2"
gdx = "1.13.1"
coroutines = "1.9.0"
serialization = "1.7.3"
ktor = "3.0.0"
kaml = "0.61.0"
slf4j = "2.0.16"

[libraries]
gdx = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# :decision's HTTP backend (OpenAiCompatBackend). OkHttp runs on both the JVM and Android.
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
# config/endpoints.yaml. 0.61 is the last kaml built on Kotlin 2.0 / serialization 1.7.
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
# Ktor logs through SLF4J; the CLI and desktop bind it to nothing instead of printing a warning.
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
